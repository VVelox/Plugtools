# Writable state directory for the SSO grant store (SQLite; ssoStoragePath).
# Only mojo_nisaba_sso needs this.
#
# Install to /usr/lib/tmpfiles.d/ (packages) or /etc/tmpfiles.d/ (local), then:
#   systemd-tmpfiles --create
#
# Type Path            Mode UID     GID     Age Argument
d      /var/db/nisaba  0700 nisaba  nisaba  -
