# Create the system user/group that the App::Nisaba services run as.
#
# Install to /usr/lib/sysusers.d/ (packages) or /etc/sysusers.d/ (local), then:
#   systemd-sysusers
#
# Type Name    ID  GECOS                 Home            Shell
u      nisaba  -   "App::Nisaba services" /var/db/nisaba  /usr/sbin/nologin
